services:
  - type: web
    name: apple-store-management
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: apple-store-db
          property: connectionString

databases:
  - name: apple-store-db
    plan: free
    databaseName: apple_store_db
    user: apple_store_user

