<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#af52de" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#141419" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af52de"/>
      <stop offset="100%" stop-color="#7c25a8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.18)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGlow)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Glass Card Container -->
  <rect x="70" y="50" width="660" height="500" rx="32" fill="rgba(255,255,255,0.035)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top AppleCare+ Branding -->
  <g transform="translate(110, 110)">
    <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.1)"/>
    <path d="M16 8 C17 9.5 18 10 19.5 10 C19.2 11.5 18 12.8 16.5 12.8 C15.5 12.8 14.5 12.2 13.5 12.2 C12.2 12.2 11 13 11 14.8 C11 17.5 13.5 21 15.5 21 C16.5 21 17 20.2 18.2 20.2 C19.5 20.2 20 21 21 21 C22.2 21 23.2 19.5 24 18 C23 17.2 22.5 16 22.5 14.5 C22.5 12.5 24.2 11.2 24.5 11 C23.2 9.2 21.2 9 20.5 9 C19 9 17.8 9.8 17 9.8 C16.2 9.8 15.2 8.8 13.8 8.8 C12 8.8 10.5 10 10 12" fill="#ffffff" transform="scale(0.8) translate(3, 3)"/>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.5">AppleCare<tspan fill="#af52de">+</tspan></text>
    <rect x="200" y="6" width="100" height="26" rx="13" fill="#af52de" fill-opacity="0.18" stroke="#af52de" stroke-opacity="0.3" stroke-width="1"/>
    <text x="250" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#af52de" text-anchor="middle" letter-spacing="1">OFFICIAL</text>
  </g>

  <!-- Central Shield Badge -->
  <g transform="translate(400, 260)" filter="url(#glow)">
    <!-- Outer Shield -->
    <path d="M0 -90 L75 -55 C75 35 35 95 0 115 C-35 95 -75 35 -75 -55 Z" fill="url(#shieldGrad)"/>
    <!-- Inner Shield Accent -->
    <path d="M0 -78 L64 -47 C64 28 30 80 0 98 C-30 80 -64 28 -64 -47 Z" fill="rgba(0,0,0,0.25)"/>
    <!-- Plus Symbol & Apple Logo In Shield -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle">+</text>
  </g>

  <!-- Plan Target & Details -->
  <text x="400" y="420" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">iPhone 16 Pro Theft & Loss</text>
  <text x="400" y="455" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Complete Theft, Loss, and Accidental Damage Protection</text>

  <!-- Feature Tags -->
  <g transform="translate(400, 505)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.85)">
    <rect x="-260" y="-16" width="160" height="30" rx="15" fill="rgba(255,255,255,0.08)"/>
    <text x="-180" y="4" text-anchor="middle">Unlimited Repairs</text>

    <rect x="-80" y="-16" width="160" height="30" rx="15" fill="rgba(255,255,255,0.08)"/>
    <text x="0" y="4" text-anchor="middle">Apple Certified Techs</text>

    <rect x="100" y="-16" width="160" height="30" rx="15" fill="rgba(255,255,255,0.08)"/>
    <text x="180" y="4" text-anchor="middle">24/7 Priority Access</text>
  </g>
</svg>